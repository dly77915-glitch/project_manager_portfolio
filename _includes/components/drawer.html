<div class="drawer-layer" data-drawer-layer hidden>
  <button class="drawer-overlay" type="button" aria-label="Close activity details" data-drawer-close></button>

  <aside
    class="activity-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="activity-drawer-title"
    tabindex="-1"
    data-activity-drawer
  >
    <div class="activity-drawer__topbar">
      <p>Activity story</p>
      <button class="drawer-close" type="button" aria-label="Close activity details" data-drawer-close>×</button>
    </div>
    <div class="activity-drawer__content" data-drawer-content></div>
  </aside>
</div>

<template id="activity-cham-di-thoi">
  <article class="drawer-story">
    <div class="drawer-story__cover drawer-story__cover--blue" role="img" aria-label="Placeholder cover for Cham di thoi">
      <span>Community project</span>
    </div>
    <p class="eyebrow">Community · Connection</p>
    <h2 id="activity-drawer-title">Chạm đi thôi</h2>
    <p class="drawer-story__lead">A space built around meaningful connection, empathy, and positive community experiences.</p>
    <div class="drawer-story__section">
      <h3>My role</h3>
      <p>Add your exact role, responsibilities, and the people you collaborated with here.</p>
    </div>
    <div class="drawer-story__section">
      <h3>What I contributed</h3>
      <p>Replace this placeholder with the actions you owned: planning, coordination, communication, content, operations, or on-site execution.</p>
    </div>
    <div class="drawer-story__section">
      <h3>What stayed with me</h3>
      <p>Use this space for one memorable moment and the lesson it changed in the way you work with people.</p>
    </div>
  </article>
</template>

<template id="activity-kinh-van-hoa">
  <article class="drawer-story">
    <div class="drawer-story__cover drawer-story__cover--teal" role="img" aria-label="Placeholder cover for Kinh van hoa">
      <span>Creative exploration</span>
    </div>
    <p class="eyebrow">Creative · Multiple perspectives</p>
    <h2 id="activity-drawer-title">Kính vạn hoa</h2>
    <p class="drawer-story__lead">A creative experience that encouraged me to observe people and situations through more than one lens.</p>
    <div class="drawer-story__section">
      <h3>Context</h3>
      <p>Add the background, objective, participants, and timeline of the activity here.</p>
    </div>
    <div class="drawer-story__section">
      <h3>My contribution</h3>
      <p>Describe what you initiated, organized, researched, designed, or communicated.</p>
    </div>
    <div class="drawer-story__section">
      <h3>Lesson learned</h3>
      <p>Explain how this activity strengthened your creativity, empathy, teamwork, or facilitation skills.</p>
    </div>
  </article>
</template>

<template id="activity-trung-thu-cung-em">
  <article class="drawer-story">
    <div class="drawer-story__cover drawer-story__cover--gold" role="img" aria-label="Placeholder cover for Trung thu cung em">
      <span>Volunteer activity</span>
    </div>
    <p class="eyebrow">Volunteer · Social impact</p>
    <h2 id="activity-drawer-title">Trung thu cùng em</h2>
    <p class="drawer-story__lead">A volunteer experience centered on preparation, coordination, and creating a warm celebration for children.</p>
    <div class="drawer-story__section">
      <h3>My role</h3>
      <p>Add your role and the scale of the event: team size, audience, location, or resources managed.</p>
    </div>
    <div class="drawer-story__section">
      <h3>How I helped</h3>
      <p>Describe your planning, fundraising, logistics, communication, or event-day responsibilities.</p>
    </div>
    <div class="drawer-story__section">
      <h3>Personal reflection</h3>
      <p>Tell the short story that best represents why this experience matters to you.</p>
    </div>
  </article>
</template>

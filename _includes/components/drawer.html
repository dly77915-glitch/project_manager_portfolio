        <h3>Helping the message reach people—and helping the work behind it hold together.</h3>

        <ul class="story-tags" aria-label="My contribution areas">
          <li>Communicate</li>
          <li>Coordinate</li>
          <li>Support</li>
        </ul>

      <figure>
        <img src="{{ '/assets/images/activities/cham-di-thoi/learn.webp' | relative_url }}" alt="Accessible HIV knowledge" loading="lazy">
        <figcaption><strong>Learn</strong><span>Accurate knowledge.</span></figcaption>
      </figure>
      <figure>
        <img src="{{ '/assets/images/activities/cham-di-thoi/listen.webp' | relative_url }}" alt="Listening to lived experiences" loading="lazy">
        <figcaption><strong>Listen</strong><span>Stories shared with dignity.</span></figcaption>
      </figure>
      <figure>
        <img src="{{ '/assets/images/activities/cham-di-thoi/connect.webp' | relative_url }}" alt="Community connection and support" loading="lazy">
        <figcaption><strong>Connect</strong><span>Understanding made human.</span></figcaption>
      </figure>
    </section>

    <section class="story-block story-block--media-left story-block--dark">
      <figure class="story-block__media">
        <img src="{{ '/assets/images/activities/cham-di-thoi/story-35-years.webp' | relative_url }}" alt="35 Years — Stories to Be Heard and Understood" loading="lazy">
        <figcaption>35 Years — Stories to Be Heard.</figcaption>
      </figure>

        <p class="story-kicker">A story worth making room for</p>

        <p>The initiative invited people living with HIV, their families, friends, and community allies to share their experiences in the form that felt safest to them.</p>

        <figcaption>Listen before interpreting.</figcaption>
      </figure>

        <p class="story-kicker">What stayed with me</p>
        <h3>Responsible communication is also knowing when to step back.</h3>
        <p>I used to think it was mainly about choosing the right words. This experience taught me to listen without rushing to interpret—and to recognise when another person should remain the owner of their own story.</p>
      </div>
    </section>

<header class="site-header" id="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ '/' | relative_url }}">
      <span class="site-header__logo-mark">PT</span>
      <span class="site-header__logo-text">Phuong&nbsp;Thao</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        {% for item in site.nav %}
        <li>
          <a href="{{ item.href | relative_url }}">{{ item.label }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a href="{{ site.cv_path | relative_url }}" class="btn btn-accent btn-sm" target="_blank" rel="noopener">
        View CV
      </a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <span class="site-footer__name">{{ site.author }}</span>
      <span class="site-footer__role">{{ site.tagline }}</span>
    </div>

    <div class="site-footer__links">
      <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ site.cv_path | relative_url }}" target="_blank" rel="noopener">CV</a>
      <a href="{{ '/#hero' | relative_url }}">Back to top ↑</a>
    </div>

    <div class="site-footer__meta">
      &copy; {{ site.time | date: '%Y' }} {{ site.author }}. Built from scratch, end to end.
    </div>
  </div>
</footer>

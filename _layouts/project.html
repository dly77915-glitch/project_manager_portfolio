---
layout: default
---
<article class="project-detail">
  <header class="project-detail__hero">
    <div class="site-container">
      <a class="project-detail__back" href="{{ '/' | relative_url }}#projects">← Back to projects</a>
      {% if page.role %}<p class="eyebrow">{{ page.role }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="project-detail__summary">{{ page.summary }}</p>{% endif %}
    </div>
  </header>

  <div class="project-detail__content site-container prose">
    {{ content }}
  </div>
</article>

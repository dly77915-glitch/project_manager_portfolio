<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#071426">

    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.layout == 'project' %}
      <link rel="stylesheet" href="{{ '/assets/css/project.css' | relative_url }}">
    {% endif %}
  </head>
  <body class="{% if page.url == '/' %}page-home{% else %}page-inner{% endif %}{% if page.layout == 'project' %} page-project{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include header.html %}

    <main id="main-content">
      {{ content }}
    </main>

    {% include components/cv-drawer.html %}
    {% include components/drawer.html %}
    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% if page.layout == 'project' %}
      <script src="{{ '/assets/js/project.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>

<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: "Phuong Thao | Digital Project Manager" }}</title>

  <meta
    name="description"
    content="{{ page.description | default: 'Digital Project Manager portfolio focused on digital transformation, product thinking, and cross-functional project delivery.' }}"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2563EB",
            accent: "#FDE047",
            darkText: "#1F2937",
            background: "#F8F9FA"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>

<body class="bg-[#F8F9FA] text-[#1F2937] font-sans">
  {{ content }}
</body>
</html>
